###############################################################################
# MedEduAI — Netlify Deployment Configuration
#
# ARCHITECTURE:
#   Netlify Frontend (this) ──► Cloud Run Backend (API + all secrets)
#
# SECURITY RULES:
#   ✅ SAFE in Netlify env: NEXT_PUBLIC_* (designed to be public)
#   ❌ NEVER in Netlify env: SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY,
#                             RESEND_API_KEY, JWT_SECRET, or any admin key
#
# All /api/* requests are transparently proxied to Cloud Run at CDN level.
# The frontend build NEVER touches secret env vars.
###############################################################################

[build]
  command = "npm run build"

[build.environment]
  # ── Tell Next.js we're on Netlify (enables API proxy rewrites in next.config.mjs) ──
  NETLIFY = "true"
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"
  # Disable Turbopack for production build to avoid edge function bundling issues
  NEXT_TURBOPACK = "0"
  NEXT_PRIVATE_TURBOPACK = "0"
  # ── These are the ONLY safe/public vars needed at build time ──
  # Set their actual values in Netlify UI: Site > Environment variables
  # NEXT_PUBLIC_SUPABASE_URL    = (set in Netlify UI)
  # NEXT_PUBLIC_SUPABASE_ANON_KEY = (set in Netlify UI)
  # NEXT_PUBLIC_SITE_URL        = (set in Netlify UI)

# ── API Proxy → Cloud Run backend ─────────────────────────────────────────────
# ARCHITECTURE NOTE: The browser FetchInterceptor calls Cloud Run DIRECTLY
# (bypassing this redirect) so auth cookies work cross-origin (credentials:include).
# This CDN redirect is a SAFETY FALLBACK only — e.g. for server-side fetches or
# any request that doesn't go through the FetchInterceptor.
[[redirects]]
  from   = "/api/*"
  to     = "https://mededuai-backend-mfz5ejaqaa-uc.a.run.app/api/:splat"
  status = 200
  force  = true
  headers = { X-Forwarded-Host = "mededuai.netlify.app", X-Forwarded-Proto = "https", Cookie = "" }
